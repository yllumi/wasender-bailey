name: wabaileys

services:
  wabaileys:
    build:
      context: .
      dockerfile: Dockerfile
    image: wabaileys:latest
    container_name: wabaileys
    restart: unless-stopped

    # init:true supaya Bun tidak jadi PID 1 (reap zombie + SIGTERM rapi saat stop)
    init: true
    # Beri waktu socket Baileys menutup koneksi sebelum SIGKILL
    stop_grace_period: 20s

    # Semua konfigurasi lewat environment. Compose tetap otomatis membaca file .env di
    # direktori ini untuk interpolasi bila ada, tapi file itu TIDAK wajib — jadi
    # `docker compose up` tidak gagal hanya karena .env belum dibuat.
    # Default di kode: HTTP_AUTH_*=admin/admin, MAX_SESSIONS=15, APP_KEY=''.
    environment:
      APP_KEY: ${APP_KEY:-}
      HTTP_AUTH_USERNAME: ${HTTP_AUTH_USERNAME:-}
      HTTP_AUTH_PASSWORD: ${HTTP_AUTH_PASSWORD:-}
      MAX_SESSIONS: ${MAX_SESSIONS:-}

    ports:
      # host:container. Ubah sisi kiri (mis. "9000:8990") untuk port host lain.
      # Terbuka di semua interface; awali "127.0.0.1:" bila hanya perlu di mesin ini.
      - "8990:8990"

    volumes:
      # Named volume, bukan bind mount ke path di host. Docker yang mengatur
      # ownership (uid 1000 = user `bun`), sehingga tidak ada file atau direktori yang
      # harus dibuat lebih dulu dan tidak ada masalah permission.
      # Isinya: kredensial Baileys, sessions_registry.json, dan app key hasil rotasi.
      - wabaileys-data:/app/data

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:8990/health\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # Log Baileys sangat cerewet; batasi supaya disk tidak penuh
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wabaileys-data:
